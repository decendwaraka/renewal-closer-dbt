name: renewal_closer
version: 1.0.0
config-version: 2

profile: renewal_setter

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  renewal_closer:
    staging:
      +schema: renewal_staging
      +materialized: view
    intermediate:
      +schema: renewal_intermediate
      +materialized: ephemeral
    marts:
      +schema: renewal_marts
      +materialized: table

seeds:
  renewal_closer:
    +schema: renewal_marts
    +quote_columns: false

vars:
  # Closers (HubSpot owner ids). Kept in sync with seeds/dim_closers.csv.
  closer_owner_ids: ['82672208', '756332149', '82734543', '756339074', '76930546']
  # Renewal pipelines (base filter).
  renewal_pipeline_ids: ['95211801', '898243912']
  # New Renewal Pipeline (post-migration). Has no Due-equivalent stage at all, so rc_due is computed from
  # Membership Expiration Date for this pipeline only (fct_renewal_pipeline_snapshot.sql, 2026-08-13);
  # the old pipeline keeps its existing stage-based rc_due unchanged.
  new_renewal_pipeline_id: '898243912'
  # Closed-won stages across both pipelines (base filter).
  won_stage_ids: ['175346331', '229787714', '1359841456']
  # Winbacks Pipeline (Deal Lost -> re-approached later). Folded into renewal cash/won-deal totals via
  # int_renewal__won_deals.sql (OPEN_ISSUES #12) using this id plus winback_won_stage_ids below.
  winback_pipeline_id: '917643668'
  # Win-Back's closed-won stage (Winback Closed Won, dim_renewal_stages stage_id 1401758776).
  winback_won_stage_ids: ['1401758776']
