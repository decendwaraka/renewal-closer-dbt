version: 2

models:
  - name: fct_renewal_cash
    description: >
      Payment-grain cash fact: one row per (deal, cash component), where a component is the base
      Cash Collected plus AP1-AP12 (all twelve wired as of 2026-09-01, PR #27). Base cash is dated in ET
      at the deal's Renewal Close Date and each additional payment at its own Collected Date (approved
      2026-10-21; additional payments without a Collected Date are excluded). A payment plan's installments
      land in the month they were collected, not the month the deal closed. Count won deals from the
      `base` component only: a payment-only deal is not newly won. Carries three independent splits of the same cash: product_column
      (tier renewed into), tier_of_origin_column (tier renewed from), pipeline_type (commercial
      motion). Sum cash_amount at query time for any window.
    # cash_amount non-negativity enforced by tests/assert_cash_nonnegative.sql (no dbt_utils dependency)
    columns:
      - name: cash_date_et
        description: "ET date this component counts on: the Renewal Close Date for the base component, the Collected Date for AP1-AP12. There is no separate close-date column."
        tests: [not_null]
      - name: product_column
        description: "Product tier renewed into, from dim_product_map.csv; WINBACK for any Winbacks Pipeline deal."
        tests:
          - not_null
          - accepted_values:
              values: ['ACC_TIER', 'MM_TIER', 'TERM_2', 'WINBACK', 'UNMAPPED']
      - name: tier_of_origin_column
        description: "Tier the member was on before this renewal, from dim_member_tier_map.csv (case-insensitive join)."
        tests:
          - not_null
          - accepted_values:
              values: ['ACC_TIER', 'MM_TIER', 'TERM_2', 'UNMAPPED']
      - name: pipeline_type
        description: >
          Commercial motion behind the deal, from dim_product_map.csv, overridden to 'Win-Back' for
          any deal in the Winbacks Pipeline. UNMAPPED means a new HubSpot upsell_plan value has
          appeared that the seed does not cover -- this test is the tripwire for that.
        tests:
          - not_null
          - accepted_values:
              values: ['Upgrade', 'Restart', 'Renewal', 'Win-Back', 'UNMAPPED']

  - name: fct_renewal_live_call_contacts
    description: "(meeting, contact)-grain fact behind the Leaderboard's Live Call Close %, matching the team's HubSpot 'Live to Close Rate' report. Close % = COUNT(DISTINCT IFF(is_won_after_meeting, contact_id, NULL)) / COUNT(DISTINCT contact_id) over meeting_date_et; the team rate is distinct across closers, not a sum. DPL does NOT use this -- it stays on fct_renewal_meetings.is_closing_call."
    columns:
      - name: meeting_id
        tests: [not_null]
      - name: contact_id
        tests: [not_null]
      - name: meeting_date_et
        tests: [not_null]
      # one row per (meeting_id, contact_id) enforced by tests/assert_live_call_contacts_unique_pair.sql

  - name: fct_renewal_pc_close_deals
    description: "(deal, qualifying meeting)-grain fact behind PC Close % in Call Outcomes, replicating HubSpot report 445343752 (Celeste, 2026-10-21). Qualifying deal = never entered Renewal Call Complete - Nurture / Renewal Call Invited / Scheduled (either pipeline) with at least one COMPLETED Renewal 3 Month or Renewal Accelerator 3 month meeting joined through a contact (meeting -> contact -> deal, as in the report), Renewal Pipeline (898243912) only. Dated by meeting_date_et (approved window; NOT Renewal Close Date). PC Close % = COUNT(DISTINCT IFF(is_won, deal_id, NULL)) / COUNT(DISTINCT deal_id) over the window; attributed to the deal owner; closer_name IS NULL = off-roster or unassigned owner. The Post Webinar 30d flag is not applied (always 0 on these meetings)."
    columns:
      - name: deal_id
        tests: [not_null]
      - name: meeting_id
        tests: [not_null]
      - name: meeting_date_et
        tests: [not_null]
      - name: is_won
        tests: [not_null]
      # one row per (deal_id, meeting_id) enforced by tests/assert_pc_close_deals_unique_pair.sql

  - name: fct_renewal_meetings
    description: >
      Meeting-grain fact: PC/RC/PWC/WB/WB_FOLLOW_UP/WB_WEBINAR/FOLLOW_UP/MENTOR_HANDOFF category +
      booked/completed flags. WB_FOLLOW_UP, WB_WEBINAR, FOLLOW_UP and MENTOR_HANDOFF are Call Outcomes
      only -- never first-call ranked, never closing calls. is_dpl_call is the Avg DPL denominator and
      is independent of meeting_category (Celeste, 2026-10-19).
    columns:
      - name: meeting_id
        tests: [unique, not_null]
      - name: meeting_category
        tests:
          - accepted_values:
              # FOLLOW_UP and MENTOR_HANDOFF added 2026-10-19 (Celeste, Metrics Guide #2/#3b): both are
              # Call Outcomes only. CI runs `dbt run` and never `dbt test`, so this list is only a guard
              # when someone runs the suite locally -- keep it in sync by hand with the CASE in
              # int_renewal__meetings.sql.
              values: ['PC', 'RC', 'PWC', 'WB', 'WB_FOLLOW_UP', 'WB_WEBINAR', 'FOLLOW_UP', 'MENTOR_HANDOFF']
      - name: is_dpl_call
        description: >
          Avg DPL denominator (Celeste, 2026-10-19, HubSpot report 445533588): TRUE for every call of
          the six types in the dpl_call_types() macro, at ANY outcome, with no per-deal dedup. Read it
          alone -- AND-ing it with is_completed or is_first_call reimposes the filtering her report does
          not do. It is NOT derivable from meeting_category: the six types span RC, PWC, WB, WB_WEBINAR
          and MENTOR_HANDOFF.
        tests: [not_null]
      - name: is_first_call
        description: "First completed call per (deal_id, meeting_category) -- OPEN_ISSUES #23. DPL/Close Rate should filter on this; Call Outcomes counts intentionally don't. ALWAYS read it as `is_completed AND is_first_call`: non-completed calls are never ranked and fall through to TRUE, so on its own the flag makes a canceled call look like an un-deduped follow-up."
        # one-first-call-per-(deal, category) enforced by tests/assert_first_call_dedup.sql
      - name: meeting_outcome
        tests:
          - accepted_values:
              # Known values incl. sub-outcomes found in data (OPEN_ISSUES #7). warn (not error) so a
              # genuinely new outcome value surfaces without breaking the build.
              severity: warn
              values:
                - 'COMPLETED'
                - 'COMPLETED - NURTURE'
                - 'COMPLETED - QUALIFIED'
                - 'COMPLETED - DQ'
                - 'CANCELED'
                - 'CANCELLED'
                - 'NO_SHOW'
                - 'RESCHEDULED'
                - 'SCHEDULED'

  - name: fct_renewal_pipeline_owner_stage
    description: >
      Renewal Pipeline Snapshot, replicating the HubSpot report of the same name: all deals currently in
      the Renewal Pipeline (898243912) by deal owner and current deal stage. One row per (closer, stage),
      zero counts included. All-time, unwindowed, no test-contact exclusion (the report has neither).
      Team closers only (dim_closers.rep_team IS NOT NULL).
    columns:
      - name: closer_owner_id
        tests: [not_null]
      - name: stage_id
        tests: [not_null]
      - name: deal_count
        tests: [not_null]

  - name: fct_renewal_pipeline_snapshot
    description: >
      Per-closer deal-stage fact (#36-#51): one row per (deal, current snapshot_col bucket), dated by
      entry_date_et so any date window can be applied downstream -- deals that entered their current
      stage during the selected range. Every bucket comes from the deal's CURRENT dealstage_id mapped
      through dim_renewal_stages, dated by hs_v2_date_entered_current_stage. Excludes deals linked to
      Internal Test contacts. Feeds both the Renewal Pipeline section and the Win-Back Pipeline
      section (the latter reads snapshot_col LIKE 'wb_%').
      2026-10-19 (Celeste, Metrics Guide #12): the pc_due and rc_due buckets are gone, along with the
      date-derivation behind them -- her report shows current stage only. Expect New Member to rise:
      those buckets used to pull near-expiration deals out of their real stage.

    columns:
      - name: deal_id
        tests: [not_null]
      - name: entry_date_et
        tests: [not_null]

  - name: fct_renewal_stage_entries
    description: >
      DEPRECATED 2026-08-28 -- superseded by fct_renewal_contact_invites + fct_renewal_contact_bookings.
      Deal-grain fact: one row per (deal_id, stage_entry_type, entry_date_et) for PC/RC Invited/Scheduled
      stage-entry dates, across both renewal pipelines. Backed Call Outcomes Invited/Booked/Book% until
      Celeste's "match the HubSpot report" decision moved all three to the contact basis; her report was
      never built on deal stages. Kept rather than dropped: nothing in dbt depends on it, it is a view so
      it costs nothing, and given the OPEN_ISSUES #41 / #47 history someone will want to compare the two
      bases. No new consumers.
    columns:
      - name: deal_id
        tests: [not_null]
      - name: stage_entry_type
        tests:
          - not_null
          - accepted_values:
              values: ['pc_invited', 'pc_scheduled', 'rc_invited', 'rc_scheduled']

  - name: fct_renewal_contact_invites
    description: >
      Contact-grain invited cohort: one row per (contact_id, invite_flow, invite_tier, invited_date_et)
      from the six HubSpot CONTACT invite date properties Celeste's "True Booking Rate" report ORs
      together. Denominator of Book% and the source of the Invited column. Per tier, not collapsed per
      flow, so a contact invited on different properties in different months belongs to both windows --
      always count COUNT(DISTINCT contact_id). Not scoped to dim_closers; the reporting layer joins it.
    columns:
      - name: contact_id
        tests: [not_null]
      - name: invite_flow
        tests:
          - not_null
          - accepted_values:
              values: ['PC', 'RC']
      - name: invite_tier
        tests:
          - not_null
          - accepted_values:
              values: ['MM', 'ACC', '2YR']
      - name: invited_date_et
        tests: [not_null]

  - name: fct_renewal_contact_bookings
    description: >
      Contact-grain booked cohort: one row per (contact_id, meeting_id) for every renewal-type meeting,
      dated by when the meeting RECORD was created (hs_createdate) -- when the member booked, not when the
      call happens. Numerator of Book%. Joined to fct_renewal_contact_invites on contact_id with the date
      window applied to BOTH sides independently, which is what her report does. Not restricted to the
      invited flow and carries no meeting-outcome filter, again matching her report.
    columns:
      - name: contact_id
        tests: [not_null]
      - name: meeting_id
        tests: [not_null]
      - name: booked_date_et
        tests: [not_null]
      - name: activity_type_key
        description: "LOWER(TRIM(activity_type)). Kept so a re-cased HubSpot duplicate can be spotted here without re-reading RAW."
        tests:
          - accepted_values:
              values: [
                'renewal 3 month', 'renewal accelerator 3 month',
                'renewal strategy', 'renewal accelerator',
                'renewal post webinar call',
              ]

  - name: rpt_renewal_closer_dashboard
    description: "Per-closer MTD / prior-MTD / goal reporting table feeding the dashboard."
    columns:
      - name: closer_owner_id
        tests: [unique, not_null]

unit_tests:
  - name: test_pipeline_snapshot_maps_winback_and_renewal_stages
    description: "Winback and renewal-pipeline stages both roll up to the right snapshot_col per closer, dated by entry_date_et, and different pipelines/closers don't bleed into each other's rows."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '917643668', dealstage_id: '1401758773', date_entered_current_stage: '2026-06-15T18:00:00'}
          - {deal_id: 2, closer_owner_id: '82672208', pipeline_id: '917643668', dealstage_id: '1401758773', date_entered_current_stage: '2026-06-20T18:00:00'}
          - {deal_id: 3, closer_owner_id: '82734543', pipeline_id: '95211801', dealstage_id: '175346325', date_entered_current_stage: '2026-07-01T18:00:00'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1401758773', pipeline_id: '917643668', stage_group: 'winback', snapshot_col: 'wb_booked'}
          - {stage_id: '175346325', pipeline_id: '95211801', stage_group: 'progress_call', snapshot_col: 'pc_scheduled'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
          - {owner_id: '82734543', closer_name: 'Elisabeth Rogers'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '917643668', stage_group: 'winback', snapshot_col: 'wb_booked', deal_id: 1, entry_date_et: '2026-06-15'}
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '917643668', stage_group: 'winback', snapshot_col: 'wb_booked', deal_id: 2, entry_date_et: '2026-06-20'}
        - {closer_owner_id: '82734543', closer_name: 'Elisabeth Rogers', pipeline_id: '95211801', stage_group: 'progress_call', snapshot_col: 'pc_scheduled', deal_id: 3, entry_date_et: '2026-07-01'}

  - name: test_pipeline_snapshot_drops_unknown_stage_or_non_closer_owner
    description: "Deals on a stage_id absent from dim_renewal_stages, or owned by someone outside dim_closers, are silently excluded -- INNER JOIN by design (matches the accepted OPEN_ISSUES #9 roster decision), not a bug."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '000000000', dealstage_id: '000000000'}
          - {deal_id: 2, closer_owner_id: '999999999', pipeline_id: '917643668', dealstage_id: '1401758773'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1401758773', pipeline_id: '917643668', stage_group: 'winback', snapshot_col: 'wb_booked'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows: []

  - name: test_pipeline_snapshot_excludes_internal_test_contacts
    description: "A deal linked to an Internal Test contact is excluded entirely (Sub-task 3, 2026-08-13); a deal with no test-contact match still counts normally, dated by its own entry_date_et."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346325', date_entered_current_stage: '2026-06-15T18:00:00'}
          - {deal_id: 2, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346325', date_entered_current_stage: '2026-06-18T18:00:00'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '175346325', pipeline_id: '95211801', stage_group: 'progress_call', snapshot_col: 'pc_scheduled'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows:
          - {deal_id: 1, is_test_contact: true}
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '95211801', stage_group: 'progress_call', snapshot_col: 'pc_scheduled', deal_id: 2, entry_date_et: '2026-06-18'}

  - name: test_pipeline_snapshot_has_no_due_buckets
    description: >
      Replaces the five pc_due / rc_due tests deleted on 2026-10-19 (Celeste, Metrics Guide #12). The
      Due buckets were synthetic and date-derived -- rc_due fired 45 days before Membership Expiration
      Date, pc_due 15 days before the membership midpoint -- and her Renewal Pipeline report has no
      such columns. This test is the guard that they stay gone: the fixture deal is a new-pipeline
      deal sitting in new_member with BOTH a close date and a near-term membership_expiration_date, so
      under the old logic it would have been pulled out of new_member and re-bucketed as rc_due. It
      must now stay in new_member, dated by its own date_entered_current_stage. That is the expected
      New Member rise, not a regression -- deals report under the stage they are actually in.
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '898243912', dealstage_id: '1359829634', close_date: '2026-02-15', membership_expiration_date: '2026-11-01', date_entered_current_stage: '2026-10-01T18:00:00'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1359829634', pipeline_id: '898243912', stage_group: 'renewal_pipeline', snapshot_col: 'new_member'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '898243912', stage_group: 'renewal_pipeline', snapshot_col: 'new_member', deal_id: 1, entry_date_et: '2026-10-01'}
