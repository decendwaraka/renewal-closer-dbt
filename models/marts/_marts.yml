version: 2

models:
  - name: fct_renewal_cash
    description: "Payment-grain cash fact (base+AP1+AP2 today; OPEN_ISSUES #1). ET-dated, with product attrs."
    # cash_amount non-negativity enforced by tests/assert_cash_nonnegative.sql (no dbt_utils dependency)

  - name: fct_renewal_meetings
    description: "Meeting-grain fact: PC/RC/PWC/WB category + booked/completed flags."
    columns:
      - name: meeting_id
        tests: [unique, not_null]
      - name: meeting_category
        tests:
          - accepted_values:
              values: ['PC', 'RC', 'PWC', 'WB']
      - name: is_first_call
        description: "First completed call per (deal_id, meeting_category) -- OPEN_ISSUES #23. DPL/Close Rate should filter on this; Call Outcomes counts intentionally don't. ALWAYS read it as `is_completed AND is_first_call`: non-completed calls are never ranked and fall through to TRUE, so on its own the flag makes a canceled call look like an un-deduped follow-up."
        # one-first-call-per-(deal, category) enforced by tests/assert_first_call_dedup.sql
      - name: meeting_outcome
        tests:
          - accepted_values:
              # Known values incl. sub-outcomes found in data (OPEN_ISSUES #7). warn (not error) so a
              # genuinely new outcome value surfaces without breaking the build.
              severity: warn
              values:
                - 'COMPLETED'
                - 'COMPLETED - NURTURE'
                - 'COMPLETED - QUALIFIED'
                - 'COMPLETED - DQ'
                - 'CANCELED'
                - 'CANCELLED'
                - 'NO_SHOW'
                - 'RESCHEDULED'
                - 'SCHEDULED'

  - name: fct_renewal_pipeline_snapshot
    description: "Per-closer deal-stage fact (#36-#51): one row per (deal, current snapshot_col bucket), dated by entry_date_et so any date window can be applied downstream -- deals that entered their current stage during the selected range. rc_due's entry_date_et is date-computed (45 days before Membership Expiration Date) for the new Renewal Pipeline (898243912) only; pc_due's entry_date_et is 15 days before the deal's own start/expiration midpoint, with no upper bound -- stays due until the deal's stage actually shifts to PC Invited (Celeste, 2026-08-16). Both date-based buckets are new-Renewal-Pipeline only; per-stage date_entered_current_stage elsewhere. Excludes deals linked to Internal Test contacts."
    columns:
      - name: deal_id
        tests: [not_null]
      - name: entry_date_et
        tests: [not_null]

  - name: fct_renewal_stage_entries
    description: >
      DEPRECATED 2026-08-28 -- superseded by fct_renewal_contact_invites + fct_renewal_contact_bookings.
      Deal-grain fact: one row per (deal_id, stage_entry_type, entry_date_et) for PC/RC Invited/Scheduled
      stage-entry dates, across both renewal pipelines. Backed Call Outcomes Invited/Booked/Book% until
      Celeste's "match the HubSpot report" decision moved all three to the contact basis; her report was
      never built on deal stages. Kept rather than dropped: nothing in dbt depends on it, it is a view so
      it costs nothing, and given the OPEN_ISSUES #41 / #47 history someone will want to compare the two
      bases. No new consumers.
    columns:
      - name: deal_id
        tests: [not_null]
      - name: stage_entry_type
        tests:
          - not_null
          - accepted_values:
              values: ['pc_invited', 'pc_scheduled', 'rc_invited', 'rc_scheduled']

  - name: fct_renewal_contact_invites
    description: >
      Contact-grain invited cohort: one row per (contact_id, invite_flow, invite_tier, invited_date_et)
      from the six HubSpot CONTACT invite date properties Celeste's "True Booking Rate" report ORs
      together. Denominator of Book% and the source of the Invited column. Per tier, not collapsed per
      flow, so a contact invited on different properties in different months belongs to both windows --
      always count COUNT(DISTINCT contact_id). Not scoped to dim_closers; the reporting layer joins it.
    columns:
      - name: contact_id
        tests: [not_null]
      - name: invite_flow
        tests:
          - not_null
          - accepted_values:
              values: ['PC', 'RC']
      - name: invite_tier
        tests:
          - not_null
          - accepted_values:
              values: ['MM', 'ACC', '2YR']
      - name: invited_date_et
        tests: [not_null]

  - name: fct_renewal_contact_bookings
    description: >
      Contact-grain booked cohort: one row per (contact_id, meeting_id) for every renewal-type meeting,
      dated by when the meeting RECORD was created (hs_createdate) -- when the member booked, not when the
      call happens. Numerator of Book%. Joined to fct_renewal_contact_invites on contact_id with the date
      window applied to BOTH sides independently, which is what her report does. Not restricted to the
      invited flow and carries no meeting-outcome filter, again matching her report.
    columns:
      - name: contact_id
        tests: [not_null]
      - name: meeting_id
        tests: [not_null]
      - name: booked_date_et
        tests: [not_null]
      - name: activity_type_key
        description: "LOWER(TRIM(activity_type)). Kept so a re-cased HubSpot duplicate can be spotted here without re-reading RAW."
        tests:
          - accepted_values:
              values: [
                'renewal 3 month', 'renewal accelerator 3 month',
                'renewal strategy', 'renewal strategy alignment',
                'renewal accelerator', 'renewal follow-up',
                'renewal post webinar call',
              ]

  - name: rpt_renewal_closer_dashboard
    description: "Per-closer MTD / prior-MTD / goal reporting table feeding the dashboard."
    columns:
      - name: closer_owner_id
        tests: [unique, not_null]

unit_tests:
  - name: test_pipeline_snapshot_maps_winback_and_renewal_stages
    description: "Winback and renewal-pipeline stages both roll up to the right snapshot_col per closer, dated by entry_date_et, and different pipelines/closers don't bleed into each other's rows."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '917643668', dealstage_id: '1401758773', date_entered_current_stage: '2026-06-15T18:00:00'}
          - {deal_id: 2, closer_owner_id: '82672208', pipeline_id: '917643668', dealstage_id: '1401758773', date_entered_current_stage: '2026-06-20T18:00:00'}
          - {deal_id: 3, closer_owner_id: '82734543', pipeline_id: '95211801', dealstage_id: '175346325', date_entered_current_stage: '2026-07-01T18:00:00'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1401758773', pipeline_id: '917643668', stage_group: 'winback', snapshot_col: 'wb_booked'}
          - {stage_id: '175346325', pipeline_id: '95211801', stage_group: 'progress_call', snapshot_col: 'pc_scheduled'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
          - {owner_id: '82734543', closer_name: 'Elisabeth Rogers'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '917643668', stage_group: 'winback', snapshot_col: 'wb_booked', deal_id: 1, entry_date_et: '2026-06-15'}
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '917643668', stage_group: 'winback', snapshot_col: 'wb_booked', deal_id: 2, entry_date_et: '2026-06-20'}
        - {closer_owner_id: '82734543', closer_name: 'Elisabeth Rogers', pipeline_id: '95211801', stage_group: 'progress_call', snapshot_col: 'pc_scheduled', deal_id: 3, entry_date_et: '2026-07-01'}

  - name: test_pipeline_snapshot_drops_unknown_stage_or_non_closer_owner
    description: "Deals on a stage_id absent from dim_renewal_stages, or owned by someone outside dim_closers, are silently excluded -- INNER JOIN by design (matches the accepted OPEN_ISSUES #9 roster decision), not a bug."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '000000000', dealstage_id: '000000000'}
          - {deal_id: 2, closer_owner_id: '999999999', pipeline_id: '917643668', dealstage_id: '1401758773'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1401758773', pipeline_id: '917643668', stage_group: 'winback', snapshot_col: 'wb_booked'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows: []

  - name: test_pipeline_snapshot_excludes_internal_test_contacts
    description: "A deal linked to an Internal Test contact is excluded entirely (Sub-task 3, 2026-08-13); a deal with no test-contact match still counts normally, dated by its own entry_date_et."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346325', date_entered_current_stage: '2026-06-15T18:00:00'}
          - {deal_id: 2, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346325', date_entered_current_stage: '2026-06-18T18:00:00'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '175346325', pipeline_id: '95211801', stage_group: 'progress_call', snapshot_col: 'pc_scheduled'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows:
          - {deal_id: 1, is_test_contact: true}
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '95211801', stage_group: 'progress_call', snapshot_col: 'pc_scheduled', deal_id: 2, entry_date_et: '2026-06-18'}

  - name: test_pipeline_snapshot_rc_due_entry_date_is_45_days_before_expiration
    description: "New-pipeline rc_due is a synthetic bucket (no stage-based Due equivalent exists there) -- entry_date_et is computed as 45 days before Membership Expiration Date, not the day the dashboard happens to load, so it windows like every other bucket."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '898243912', dealstage_id: '1359841792', membership_expiration_date: '2026-09-05'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1359841792', pipeline_id: '898243912', stage_group: 'renewal_pipeline', snapshot_col: 'pc_invited'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '898243912', stage_group: 'renewal_call', snapshot_col: 'rc_due', deal_id: 1, entry_date_et: '2026-07-22'}

  - name: test_pipeline_snapshot_pc_due_entry_date_is_15_days_before_midpoint
    description: "New-pipeline pc_due is a synthetic bucket like rc_due -- entry_date_et is 15 days before the membership midpoint (Celeste, 2026-08-16), where midpoint = halfway between the start date (Renewal - Close Date, else Close Date, else contact true_renewal_close_date) and Membership Expiration Date. Fixture: 2026-02-15 to 2027-02-15 (365d) -> midpoint 2026-08-16 -> entry 2026-08-01. NOT time-dependent like the old +/-45 version: there's no upper bound anymore (see the no-upper-bound test below), so once today passes the entry date this fixture keeps matching forever."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '898243912', dealstage_id: '1359829634', close_date: '2026-02-15', membership_expiration_date: '2027-02-15'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1359829634', pipeline_id: '898243912', stage_group: 'renewal_pipeline', snapshot_col: 'new_member'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '898243912', stage_group: 'progress_call', snapshot_col: 'pc_due', deal_id: 1, entry_date_et: '2026-08-01'}

  - name: test_pipeline_snapshot_pc_due_has_no_upper_bound
    description: "Confirms the old provisional +45d upper bound is gone (Celeste, 2026-08-16): a deal whose midpoint was years ago, and which is still sitting in new_member (never advanced to PC Invited), still shows up as pc_due today -- 'stays due until PC Invited' is a stage check, not a second date bound. Fixture: 2020-01-01 to 2021-01-01 (366d) -> midpoint 2020-07-02 -> entry 2020-06-17, long past any +45d cutoff the old rule would have applied."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '898243912', dealstage_id: '1359829634', close_date: '2020-01-01', membership_expiration_date: '2021-01-01'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1359829634', pipeline_id: '898243912', stage_group: 'renewal_pipeline', snapshot_col: 'new_member'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '898243912', stage_group: 'progress_call', snapshot_col: 'pc_due', deal_id: 1, entry_date_et: '2020-06-17'}

  - name: test_pipeline_snapshot_pc_due_midpoint_falls_back_to_contact_true_renewal_close_date
    description: "PC Due's 3rd start-date fallback tier (Celeste, 2026-08-16, OPEN_ISSUES #24): when both deal-level fields (Renewal - Close Date, Close Date) are blank, the contact's true_renewal_close_date (joined via stg_renewal__deal_contacts) is used instead, so the deal still gets a midpoint rather than being dropped from pc_due entirely. Same 2026-02-15 -> 2027-02-15 midpoint/entry math as the first pc_due test above, just sourced from the contact instead of the deal."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '898243912', dealstage_id: '1359829634', membership_expiration_date: '2027-02-15'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1359829634', pipeline_id: '898243912', stage_group: 'renewal_pipeline', snapshot_col: 'new_member'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows:
          - {deal_id: 1, contact_true_renewal_close_date: '2026-02-15T00:00:00'}
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '898243912', stage_group: 'progress_call', snapshot_col: 'pc_due', deal_id: 1, entry_date_et: '2026-08-01'}

  - name: test_pipeline_snapshot_rc_due_wins_when_deal_is_in_both_due_windows
    description: "A deal can satisfy the pc_due midpoint window AND the rc_due pre-expiration window at once (short term, expiration near the midpoint). rc_due is the later, more urgent state and must win, so the deal lands in exactly ONE row -- otherwise it double-counts in any Total that sums deal_count across snapshot_cols. Fixture: 2026-07-25 to 2026-09-05 (42d) -> midpoint 2026-08-15, both windows contain mid-Aug 2026. TIME-DEPENDENT via rc_due's own bound only (pc_due no longer has an upper bound): this stops matching once today passes 2026-09-05, since rc_due would then stop firing and the deal would fall to pc_due instead -- needs bumping past that date."
    model: fct_renewal_pipeline_snapshot
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '898243912', dealstage_id: '1359829634', close_date: '2026-07-25', membership_expiration_date: '2026-09-05'}
      - input: ref('dim_renewal_stages')
        rows:
          - {stage_id: '1359829634', pipeline_id: '898243912', stage_group: 'renewal_pipeline', snapshot_col: 'new_member'}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
      - input: ref('stg_renewal__deal_contacts')
        rows: []
    expect:
      rows:
        - {closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', pipeline_id: '898243912', stage_group: 'renewal_call', snapshot_col: 'rc_due', deal_id: 1, entry_date_et: '2026-07-22'}
