version: 2

sources:
  - name: hubspot_raw
    database: marketing_db
    schema: raw
    loaded_at_field: _FIVETRAN_SYNCED

    freshness:
      warn_after: {count: 4, period: hour}
      error_after: {count: 8, period: hour}

    tables:
      - name: DEAL
        description: "HubSpot deals (Fivetran-landed). Renewal cash, close date, stage, owner."
      - name: ENGAGEMENT_MEETING
        description: "Meeting engagements. Renewal PC/RC/PWC calls by hs_activity_type."
      # Meeting ids deleted in HubSpot but still live in ENGAGEMENT_MEETING: Fivetran does not capture
      # engagement deletes. Not a Fivetran table. Written by renewal-setter's
      # scripts/detect_deleted_meetings.py (GitHub Actions: recent window every 6 h, full history daily),
      # which checks every meeting id, not just setter types. Rows only arrive when something is deleted,
      # so source freshness is off; tests/assert_deleted_meetings_detection_fresh.sql watches the runs.
      - name: HUBSPOT_DELETED_MEETINGS
        description: "Meeting ids confirmed deleted in HubSpot (batch read returned nothing). Excluded in stg_renewal__meetings."
        config:
          freshness: null
        columns:
          - name: meeting_id
            data_tests:
              - unique
              - not_null
      - name: HUBSPOT_DELETED_MEETINGS_RUNS
        description: "One row per detector run. Read by tests/assert_deleted_meetings_detection_fresh.sql."
        config:
          freshness: null
      - name: ENGAGEMENT_DEAL
        description: "Meeting-to-deal association (engagement_id -> deal_id). Used for first-call dedup (OPEN_ISSUES #23)."
      - name: OWNER
        description: "Owner id -> name mapping."
      - name: DEAL_CONTACT
        description: "Deal-to-contact association (Fivetran). Used for test-contact exclusion (Sub-task 3, 2026-08-13) -- almost every deal has exactly one associated contact, a handful have two."
      - name: ENGAGEMENT_CONTACT
        description: "Meeting-to-contact association (engagement_id -> contact_id). Backs the contact-grain booked side of Call Outcomes (stg_renewal__meeting_contacts, 2026-08-28). Note it has no _fivetran_deleted column, unlike most Fivetran tables here -- soft-delete filtering happens on the meeting side."
      - name: CONTACT
        description: >
          HubSpot contacts. Two uses: hs_lead_status identifies and excludes Internal Test contacts, and
          the six invite date properties (midway_call_invited / renewal_call_invited, each x MM / _acc /
          _2yr) are the invited cohort behind Call Outcomes Invited and Book% as of 2026-08-28 --
          Celeste's live "True Booking Rate" report is built on these, not on deal stages. See
          stg_renewal__contact_invites.sql.
