version: 2

models:
  - name: stg_renewal__deals
    description: "One row per HubSpot deal, renamed. Cash columns limited to what Fivetran syncs today (OPEN_ISSUES #1)."
    columns:
      - name: deal_id
        tests: [unique, not_null]

  - name: stg_renewal__meetings
    description: "One row per meeting engagement. Renewal PC/RC/PWC calls categorized downstream."
    columns:
      - name: meeting_id
        tests: [unique, not_null]
      - name: activity_type
        description: "Raw HubSpot hs_activity_type, passed through unmodified. Downstream categorization normalizes it (case + whitespace) in int_renewal__meetings — HubSpot allows the same type under multiple casings (`Renewal Follow-Up` vs `Renewal Follow-up`, 2026-08-24), so never match this raw."

  - name: stg_renewal__contact_invites
    description: "One row per (contact_id, invite_flow, invite_tier, invited_date_et), unpivoted from the six HubSpot CONTACT invite date properties behind Celeste's True Booking Rate report. Contact grain -- this is the basis Call Outcomes Invited/Book% moved to on 2026-08-28."
    columns:
      - name: contact_id
        tests: [not_null]
      - name: invited_date_et
        tests: [not_null]

  - name: stg_renewal__meeting_contacts
    description: "One row per (contact_id, meeting_id) for renewal-type meetings, dated by hs_createdate (when the member booked). The booked side of the contact cohort. Deliberately NOT built on int_renewal__meetings, which restricts to closer-owned meetings -- her report puts no condition on the meeting owner."
    columns:
      - name: contact_id
        tests: [not_null]
      - name: booked_date_et
        tests: [not_null]

  - name: stg_renewal__meeting_deals
    description: "One row per meeting engagement with its associated deal_id (deduped to one deal per meeting), for first-call-per-deal dedup (OPEN_ISSUES #23)."
    columns:
      - name: meeting_id
        tests: [unique, not_null]

  - name: stg_renewal__deal_contacts
    description: "One row per deal with an associated contact: flags deals linked to an Internal Test contact for exclusion from pipeline totals (Sub-task 3, 2026-08-13), and carries the contact-level true_renewal_close_date PC Due fallback (OPEN_ISSUES #24, 2026-08-16)."
    columns:
      - name: deal_id
        tests: [unique, not_null]
