version: 2

models:
  - name: stg_renewal__deals
    description: "One row per HubSpot deal, renamed. Cash columns limited to what Fivetran syncs today (OPEN_ISSUES #1)."
    columns:
      - name: deal_id
        tests: [unique, not_null]

  - name: stg_renewal__meetings
    description: "One row per meeting engagement. Renewal PC/RC/PWC calls categorized downstream."
    columns:
      - name: meeting_id
        tests: [unique, not_null]

  - name: stg_renewal__meeting_deals
    description: "One row per meeting engagement with its associated deal_id (deduped to one deal per meeting), for first-call-per-deal dedup (OPEN_ISSUES #23)."
    columns:
      - name: meeting_id
        tests: [unique, not_null]

  - name: stg_renewal__deal_contacts
    description: "One row per deal with an associated contact, flagging deals linked to an Internal Test contact for exclusion from pipeline totals (Sub-task 3, 2026-08-13)."
    columns:
      - name: deal_id
        tests: [unique, not_null]

  - name: stg_renewal__contact_webinar_bookings
    description: "One row per contact with a parsed post-renewal-webinar booking date, from the renewal_webinars__booked property value (interim Post-Webinar attribution, OPEN_ISSUES #33)."
    columns:
      - name: contact_id
        tests: [unique, not_null]
