          - {meeting_id: 2, contact_id: 'B'}
          - {meeting_id: 3, contact_id: 'C'}
          - {meeting_id: 4, contact_id: 'D'}
          - {meeting_id: 5, contact_id: 'A'}
          - {meeting_id: 6, contact_id: 'E'}
          - {meeting_id: 7, contact_id: 'F'}
          - {meeting_id: 8, contact_id: 'G'}
