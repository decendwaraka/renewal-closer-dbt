        - {meeting_id: 23, meeting_category: 'PC', is_completed: true, is_closing_call: false}

  - name: test_meetings_post_webinar_monthly_dedup_and_fallback
    description: >
      Travis's rule: a PWC loses its Close Rate credit whenever the same deal already had a
      completed, non-follow-up RC that same calendar month -- credit belongs to the RC, regardless
      of which of the two came first (fixed 2026-10-05: previously only a PWC-after-RC was
      excluded, so a PWC-before-RC on the same deal/month wrongly kept both calls). Deal 200: RC
      then a later PWC in August -- the PWC is excluded (is_closing_call false), the RC still
      counts. Deal 201: PWC first, RC later that same month -- order no longer matters, the PWC is
      now excluded too (RC keeps credit). Deal 202: RC in July, PWC in August -- different months,
      both count. Meeting 40 has no HubSpot deal association at all -- the fallback (count both
      rather than guess) applies automatically since a PWC can only be excluded via a same-deal
      match. Deal 203: RC then a later WB call that month -- WB is never targeted by this
      exclusion (it's PWC-only), so both count.
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 30, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
