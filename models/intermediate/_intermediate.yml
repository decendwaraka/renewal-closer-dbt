  - name: test_meetings_is_dpl_call_spans_categories_with_no_outcome_filter
    description: >
      Avg DPL denominator (Celeste, 2026-10-19, HubSpot report 445533588). The report applies no
      meeting-outcome filter and no per-deal dedup, so is_dpl_call must be TRUE for a canceled call and
      for a repeat call on the same deal -- which is why DPL reads it alone rather than AND-ing it with
      is_completed or is_first_call. Before this change DPL ran off is_closing_call and came out roughly
      100 calls short of her report over a 30-day window.
      The flag also has to cut across meeting_category: Renewal Strategy (RC), Renewal Post Webinar Call
      (PWC), Winback Call (WB), Winback Webinar (WB_WEBINAR) and Mentor Handoff (MENTOR_HANDOFF) are all
      DPL calls, while Renewal 3 Month (PC) and Renewal Follow-up (FOLLOW_UP) are not. Meetings 102/103
      are a deliberately deduped pair on one deal: both must still count.
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 100, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-10-01 10:00:00"}
          - {meeting_id: 101, owner_id: '82672208', activity_type: 'Renewal Post Webinar Call', meeting_outcome: 'NO_SHOW', meeting_start_at: "2026-10-02 10:00:00"}
          - {meeting_id: 102, owner_id: '82672208', activity_type: 'Winback Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-10-03 10:00:00"}
          - {meeting_id: 103, owner_id: '82672208', activity_type: 'Winback Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-10-04 10:00:00"}
          - {meeting_id: 104, owner_id: '82672208', activity_type: 'Winback Webinar', meeting_outcome: 'CANCELED', meeting_start_at: "2026-10-05 10:00:00"}
          - {meeting_id: 105, owner_id: '82672208', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-10-06 10:00:00"}
          - {meeting_id: 106, owner_id: '82672208', activity_type: 'Renewal Winback Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-10-07 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows:
          - {meeting_id: 102, deal_id: 600}
          - {meeting_id: 103, deal_id: 600}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 100, meeting_category: 'RC', is_first_call: true, is_dpl_call: true}
        - {meeting_id: 101, meeting_category: 'PWC', is_first_call: true, is_dpl_call: true}
        - {meeting_id: 102, meeting_category: 'WB', is_first_call: true, is_dpl_call: true}
        - {meeting_id: 103, meeting_category: 'WB', is_first_call: false, is_dpl_call: true}
        - {meeting_id: 104, meeting_category: 'WB_WEBINAR', is_first_call: true, is_dpl_call: true}
        - {meeting_id: 105, meeting_category: 'PC', is_first_call: true, is_dpl_call: false}
        - {meeting_id: 106, meeting_category: 'WB', is_first_call: true, is_dpl_call: false}

  - name: test_meetings_activity_type_casing_is_normalized
    description: >
      Regression guard for the 2026-08-28 case-variant bug. HubSpot began accepting `Renewal Follow-Up`
      (capital U) on 2026-08-24 alongside the long-standing `Renewal Follow-up`; categorizing on the raw
      string sent all 17 to meeting_category = NULL and out of the model, understating RC Completed by 9
      and RC booked by 12 for August 2026 at the time. Both casings must behave identically. Updated
      2026-10-19 (Celeste, Metrics Guide #2): Follow-up is no longer dropped, so "identically" now means
      both casings land in FOLLOW_UP with is_closing_call false -- the stronger form of the guard, since
      it checks the two casings agree on a category rather than agreeing on being discarded. Leading and
      trailing whitespace on other types is trimmed too.
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 20, owner_id: '82672208', activity_type: 'Renewal Follow-up', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-24 10:00:00"}
          - {meeting_id: 21, owner_id: '82672208', activity_type: 'Renewal Follow-Up', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-25 10:00:00"}
          - {meeting_id: 22, owner_id: '82672208', activity_type: '  Renewal Strategy  ', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-26 10:00:00"}
          - {meeting_id: 23, owner_id: '82672208', activity_type: 'RENEWAL 3 MONTH', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-27 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows: []
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 20, meeting_category: 'FOLLOW_UP', is_completed: true, is_closing_call: false}
        - {meeting_id: 21, meeting_category: 'FOLLOW_UP', is_completed: true, is_closing_call: false}
