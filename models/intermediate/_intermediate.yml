version: 2

models:
  - name: int_renewal__won_deals
    description: "Closed-won renewal deals owned by a current closer, with ET close date and cash inputs."
  - name: int_renewal__deal_cash
    description: "Cash exploded to (deal, component) grain, each dated by its own field. base+AP1+AP2 today (OPEN_ISSUES #1)."
  - name: int_renewal__meetings
    description: "Renewal meetings categorized PC/RC/PWC with booked/completed flags, attributed to closers. is_first_call (OPEN_ISSUES #23) flags the first completed call per deal per category, for DPL/Close Rate dedup. is_closing_call flags completed RC/PWC/WB calls that count as a 'Closing call' on the Closing Calls Today card. Renewal Follow-up, Renewal Strategy Alignment, and Renewal Accelerator Evergreen are all retired and no longer map to any meeting_category (filtered out) -- business confirmed 2026-09-02. is_closing_call also excludes a PWC when the same deal already has an earlier completed RC that same calendar month (Travis) -- the credit belongs to the RC. When that ordering can't be pinned down precisely (no deal_id, no RC that month, or the PWC isn't the later of the two), both calls count, per the agreed fallback."

unit_tests:
  - name: test_meetings_first_call_dedup_per_deal_and_category
    description: "Only the earliest completed RC/PWC/WB call per (deal_id, meeting_category) is_first_call; a later completed call on the same deal+category is a follow-up (false). Canceled calls don't count toward ranking, so a completed call with an earlier canceled call still comes out first. PC is out of scope for dedup (always true). A call with no HubSpot deal association can't be identified as a follow-up, so it defaults to true rather than being dropped (OPEN_ISSUES #23)."
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 1, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
          - {meeting_id: 2, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
          - {meeting_id: 3, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-10 10:00:00"}
          - {meeting_id: 4, owner_id: '82672208', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 09:00:00"}
          - {meeting_id: 5, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'CANCELED', meeting_start_at: "2026-07-28 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows:
          - {meeting_id: 1, deal_id: 100}
          - {meeting_id: 2, deal_id: 100}
          - {meeting_id: 4, deal_id: 100}
          - {meeting_id: 5, deal_id: 100}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 1, closer_owner_id: '82672208', meeting_category: 'RC', deal_id: 100, is_booked: true, is_completed: true, is_first_call: true}
        - {meeting_id: 2, closer_owner_id: '82672208', meeting_category: 'RC', deal_id: 100, is_booked: true, is_completed: true, is_first_call: false}
        - {meeting_id: 3, closer_owner_id: '82672208', meeting_category: 'RC', deal_id: null, is_booked: true, is_completed: true, is_first_call: true}
        - {meeting_id: 4, closer_owner_id: '82672208', meeting_category: 'PC', deal_id: 100, is_booked: true, is_completed: true, is_first_call: true}
        - {meeting_id: 5, closer_owner_id: '82672208', meeting_category: 'RC', deal_id: 100, is_booked: false, is_completed: false, is_first_call: true}


  - name: test_meetings_closing_call_flag_and_retired_activity_types
    description: >
      Renewal Accelerator Evergreen, Renewal Follow-up, and Renewal Strategy Alignment (all retired from
      the RC list -- business confirmed 2026-09-02) get no meeting_category and are filtered out of the
      model entirely, none of the three showing up in the output at all. Renewal Strategy (an ordinary RC
      call) categorizes as RC and is_closing_call is true.
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 10, owner_id: '82672208', activity_type: 'Renewal Accelerator Evergreen', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
          - {meeting_id: 11, owner_id: '82672208', activity_type: 'Renewal Follow-up', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-02 10:00:00"}
          - {meeting_id: 12, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-03 10:00:00"}
          - {meeting_id: 13, owner_id: '82672208', activity_type: 'Renewal Strategy Alignment', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-04 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows: []
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 12, activity_type: 'Renewal Strategy', meeting_category: 'RC', is_completed: true, is_closing_call: true}

  - name: test_meetings_activity_type_casing_is_normalized
    description: >
      Regression guard for the 2026-08-28 case-variant bug. HubSpot began accepting `Renewal Follow-Up`
      (capital U) on 2026-08-24 alongside the long-standing `Renewal Follow-up`; categorizing on the raw
      string sent all 17 to meeting_category = NULL and out of the model, understating RC Completed by 9
      and RC booked by 12 for August 2026 at the time. Both casings must behave identically -- now that
      Renewal Follow-up is retired from RC entirely (business confirmed 2026-09-02), "identically" means
      both casings get no meeting_category and are filtered out, same as before the fix but now on purpose
      rather than by casing accident. Leading and trailing whitespace on other types is trimmed too.
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 20, owner_id: '82672208', activity_type: 'Renewal Follow-up', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-24 10:00:00"}
          - {meeting_id: 21, owner_id: '82672208', activity_type: 'Renewal Follow-Up', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-25 10:00:00"}
          - {meeting_id: 22, owner_id: '82672208', activity_type: '  Renewal Strategy  ', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-26 10:00:00"}
          - {meeting_id: 23, owner_id: '82672208', activity_type: 'RENEWAL 3 MONTH', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-27 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows: []
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 22, meeting_category: 'RC', is_completed: true, is_closing_call: true}
        - {meeting_id: 23, meeting_category: 'PC', is_completed: true, is_closing_call: false}

  - name: test_meetings_post_webinar_monthly_dedup_and_fallback
    description: >
      Travis's rule: a PWC loses its Close Rate credit only when the same deal already had an
      earlier completed, non-follow-up RC that same calendar month -- credit belongs to the RC.
      Deal 200: RC then a later PWC in August -- the PWC is excluded (is_closing_call false), the
      RC still counts. Deal 201: PWC first, RC later that same month -- order matters, so the
      earlier PWC still counts (both true). Deal 202: RC in July, PWC in August -- different
      months, both count. Meeting 40 has no HubSpot deal association at all -- the fallback (count
      both rather than guess) applies automatically since a PWC can only be excluded via a
      same-deal match. Deal 203: RC then a later WB call that month -- WB is never targeted by
      this exclusion (it's PWC-only), so both count.
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 30, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
          - {meeting_id: 31, owner_id: '82672208', activity_type: 'Renewal Post Webinar Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
          - {meeting_id: 32, owner_id: '82672208', activity_type: 'Renewal Post Webinar Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
          - {meeting_id: 33, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
          - {meeting_id: 34, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-07-01 10:00:00"}
          - {meeting_id: 35, owner_id: '82672208', activity_type: 'Renewal Post Webinar Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
          - {meeting_id: 40, owner_id: '82672208', activity_type: 'Renewal Post Webinar Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
          - {meeting_id: 50, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
          - {meeting_id: 51, owner_id: '82672208', activity_type: 'Renewal Winback Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows:
          - {meeting_id: 30, deal_id: 200}
          - {meeting_id: 31, deal_id: 200}
          - {meeting_id: 32, deal_id: 201}
          - {meeting_id: 33, deal_id: 201}
          - {meeting_id: 34, deal_id: 202}
          - {meeting_id: 35, deal_id: 202}
          - {meeting_id: 50, deal_id: 203}
          - {meeting_id: 51, deal_id: 203}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 30, deal_id: 200, meeting_category: 'RC', is_closing_call: true}
        - {meeting_id: 31, deal_id: 200, meeting_category: 'PWC', is_closing_call: false}
        - {meeting_id: 32, deal_id: 201, meeting_category: 'PWC', is_closing_call: true}
        - {meeting_id: 33, deal_id: 201, meeting_category: 'RC', is_closing_call: true}
        - {meeting_id: 34, deal_id: 202, meeting_category: 'RC', is_closing_call: true}
        - {meeting_id: 35, deal_id: 202, meeting_category: 'PWC', is_closing_call: true}
        - {meeting_id: 40, deal_id: null, meeting_category: 'PWC', is_closing_call: true}
        - {meeting_id: 50, deal_id: 203, meeting_category: 'RC', is_closing_call: true}
        - {meeting_id: 51, deal_id: 203, meeting_category: 'WB', is_closing_call: true}

  - name: test_won_deals_includes_winback_pipeline_on_won_stage
    description: "A Win-Back deal on its closed-won stage (1401758776) is now folded into renewal cash/won-deal totals alongside the two renewal pipelines (OPEN_ISSUES #12) -- previously excluded entirely (deliberate v1 scope decision, now reversed). A Win-Back deal NOT yet on the closed-won stage (still e.g. Winback Booked) stays excluded, same as a renewal deal not on a won stage."
    model: int_renewal__won_deals
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '917643668', dealstage_id: '1401758776', close_date: "2026-08-01", cash_collected: 12000}
          - {deal_id: 2, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346331', close_date: "2026-08-01", cash_collected: 5000}
          - {deal_id: 3, closer_owner_id: '82672208', pipeline_id: '917643668', dealstage_id: '1401758773', close_date: "2026-08-01", cash_collected: 0}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '917643668', dealstage_id: '1401758776', close_date_et: "2026-08-01", cash_collected: 12000, is_post_webinar_close: false}
        - {deal_id: 2, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346331', close_date_et: "2026-08-01", cash_collected: 5000, is_post_webinar_close: false}

  - name: test_won_deals_excludes_non_won_stage_and_non_closer
    description: "A renewal-pipeline deal not on a won stage, and a deal owned outside dim_closers, are both excluded."
    model: int_renewal__won_deals
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346325', close_date: "2026-08-01", cash_collected: 5000}
          - {deal_id: 2, closer_owner_id: '999999999', pipeline_id: '95211801', dealstage_id: '175346331', close_date: "2026-08-01", cash_collected: 5000}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows: []

  - name: test_won_deals_post_webinar_attribution_from_deal_property
    description: "is_post_webinar_close (OPEN_ISSUES #33) reads directly off the deal's own renewal_traffic_source property -- 'Webinar' flags true, blank/any other value flags false, no contact join involved (Celeste's deal-level property, 2026-08-16, supersedes the retired interim contact-parsing method)."
    model: int_renewal__won_deals
    given:
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346331', close_date: "2026-08-01", cash_collected: 5000, renewal_traffic_source: 'Webinar'}
          - {deal_id: 2, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346331', close_date: "2026-08-01", cash_collected: 5000, renewal_traffic_source: ''}
          - {deal_id: 3, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346331', close_date: "2026-08-01", cash_collected: 5000, renewal_traffic_source: null}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {deal_id: 1, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346331', close_date_et: "2026-08-01", cash_collected: 5000, is_post_webinar_close: true}
        - {deal_id: 2, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346331', close_date_et: "2026-08-01", cash_collected: 5000, is_post_webinar_close: false}
        - {deal_id: 3, closer_owner_id: '82672208', pipeline_id: '95211801', dealstage_id: '175346331', close_date_et: "2026-08-01", cash_collected: 5000, is_post_webinar_close: false}
