      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {deal_id: '100', meeting_id: 1, meeting_date_et: "2026-09-10", closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', is_won: true}
        - {deal_id: '200', meeting_id: 2, meeting_date_et: "2026-09-11", closer_owner_id: '99999999', closer_name: null, is_won: false}
        - {deal_id: '100', meeting_id: 7, meeting_date_et: "2026-09-16", closer_owner_id: '82672208', closer_name: 'Sufijan Cunningham', is_won: true}

  - name: test_meetings_first_call_dedup_per_deal_and_category
    description: "Only the earliest completed RC/PWC/WB call per (deal_id, meeting_category) is_first_call; a later completed call on the same deal+category is a follow-up (false). Canceled calls don't count toward ranking, so a completed call with an earlier canceled call still comes out first. PC is out of scope for dedup (always true). A call with no HubSpot deal association can't be identified as a follow-up, so it defaults to true rather than being dropped (OPEN_ISSUES #23)."
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 1, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
          - {meeting_id: 2, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
          - {meeting_id: 3, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-10 10:00:00"}
          - {meeting_id: 4, owner_id: '82672208', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 09:00:00"}
          - {meeting_id: 5, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'CANCELED', meeting_start_at: "2026-07-28 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows:
          - {meeting_id: 1, deal_id: 100}
          - {meeting_id: 2, deal_id: 100}
          - {meeting_id: 4, deal_id: 100}
          - {meeting_id: 5, deal_id: 100}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 1, closer_owner_id: '82672208', meeting_category: 'RC', deal_id: 100, is_booked: true, is_completed: true, is_first_call: true}
        - {meeting_id: 2, closer_owner_id: '82672208', meeting_category: 'RC', deal_id: 100, is_booked: true, is_completed: true, is_first_call: false}
        - {meeting_id: 3, closer_owner_id: '82672208', meeting_category: 'RC', deal_id: null, is_booked: true, is_completed: true, is_first_call: true}
        - {meeting_id: 4, closer_owner_id: '82672208', meeting_category: 'PC', deal_id: 100, is_booked: true, is_completed: true, is_first_call: true}
        - {meeting_id: 5, closer_owner_id: '82672208', meeting_category: 'RC', deal_id: 100, is_booked: false, is_completed: false, is_first_call: true}


  - name: test_meetings_closing_call_flag_and_retired_activity_types
    description: >
      Renewal Accelerator Evergreen and Renewal Strategy Alignment stay fully retired (business
      confirmed 2026-09-02, re-confirmed by Celeste 2026-10-19 when Follow-up came back): neither maps
      to a meeting_category and both are filtered out of the model entirely, so neither appears in the
      output at all. Renewal Follow-up is NO LONGER retired -- as of 2026-10-19 (Celeste, Metrics Guide
      #2) it returns as its own FOLLOW_UP category for Call Outcomes, but earns no Close Rate credit:
      is_closing_call must be false even though the call is completed, because a follow-up revisits a
      call that already happened and crediting it would double-count the original RC. Renewal Strategy
      (an ordinary RC call) still categorizes as RC with is_closing_call true.
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 10, owner_id: '82672208', activity_type: 'Renewal Accelerator Evergreen', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
          - {meeting_id: 11, owner_id: '82672208', activity_type: 'Renewal Follow-up', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-02 10:00:00"}
          - {meeting_id: 12, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-03 10:00:00"}
          - {meeting_id: 13, owner_id: '82672208', activity_type: 'Renewal Strategy Alignment', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-04 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows: []
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 11, activity_type: 'Renewal Follow-up', meeting_category: 'FOLLOW_UP', is_completed: true, is_closing_call: false}
        - {meeting_id: 12, activity_type: 'Renewal Strategy', meeting_category: 'RC', is_completed: true, is_closing_call: true}

  - name: test_meetings_follow_up_and_mentor_handoff_are_call_outcomes_only
    description: >
      Celeste, 2026-10-19 (Metrics Guide #2 / #3b). Both spellings of Follow-up -- hyphen and space --
      map to FOLLOW_UP, and Mentor Handoff maps to MENTOR_HANDOFF. Neither category is in the
      IN ('RC','PWC','WB') lists, so neither is first-call ranked and neither can ever be a closing
      call, exactly like the existing WB_FOLLOW_UP / WB_WEBINAR precedent. That separation is the whole
      point of giving them their own categories: the team wanted their real call volume back on Call
      Outcomes (~75 Follow-ups and ~5 Mentor Handoffs completed in a 30-day window) WITHOUT moving
      Close % or Deals Won, since a Mentor Handoff transfers the member to a mentor rather than pitching
      a renewal and a Follow-up revisits a call already credited elsewhere.
      is_dpl_call is asserted independently here, and shows why it cannot be derived from
      meeting_category: Mentor Handoff is one of Celeste's six DPL types and so is TRUE, while Follow-up
      is not and so is FALSE -- two Call-Outcomes-only categories landing on opposite sides of DPL. The
      canceled Mentor Handoff confirms there is no outcome filter on the DPL flag.
    model: int_renewal__meetings
    given:
      - input: ref('stg_renewal__meetings')
        rows:
