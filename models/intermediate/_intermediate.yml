  - name: test_pc_close_deals_population_and_attribution
    description: >
      PC Close % population (HubSpot report 445343752). A meeting reaches a deal only through a contact:
      meeting -> contact -> deal, as in the report (Contacts primary). Completed Renewal 3 Month meeting 1
      reaches deal 100 (won, roster owner); completed Accelerator 3 month meeting 2 reaches deal 200 (open,
      off-roster owner -> closer_name null, still in the denominator). Meeting 7 has two contacts that both
      belong to deal 100 and yields one row. Out: COMPLETED - NURTURE (3), a non-3-Month type, Renewal
      Strategy (5), a deal that ever entered an excluded stage (deal 300 via meeting 4), meeting 6, a
      completed 3 Month meeting with no contact at all -- the report cannot see it, so it never counts even
      if the meeting links straight to a deal -- and deal 400 (via meeting 8), which sits in a pipeline
      other than the Renewal Pipeline, as the report's pipeline filter leaves it out.
    model: int_renewal__pc_close_deals
    given:
      - input: ref('stg_renewal__meetings')
        rows:
          - {meeting_id: 1, owner_id: '1', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-09-10 16:00:00"}
          - {meeting_id: 2, owner_id: '1', activity_type: 'Renewal Accelerator 3 month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-09-11 16:00:00"}
          - {meeting_id: 3, owner_id: '1', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED - NURTURE', meeting_start_at: "2026-09-12 16:00:00"}
          - {meeting_id: 4, owner_id: '1', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-09-13 16:00:00"}
          - {meeting_id: 5, owner_id: '1', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-09-14 16:00:00"}
          - {meeting_id: 6, owner_id: '1', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-09-15 16:00:00"}
          - {meeting_id: 7, owner_id: '1', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-09-16 16:00:00"}
          - {meeting_id: 8, owner_id: '1', activity_type: 'Renewal 3 Month', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-09-17 16:00:00"}
      - input: ref('stg_renewal__engagement_contacts')
        rows:
          - {meeting_id: 1, contact_id: 'C100'}
          - {meeting_id: 2, contact_id: 'C200'}
          - {meeting_id: 3, contact_id: 'C100'}
          - {meeting_id: 4, contact_id: 'C300'}
          - {meeting_id: 5, contact_id: 'C100'}
          - {meeting_id: 7, contact_id: 'C100'}
          - {meeting_id: 7, contact_id: 'C101'}
          - {meeting_id: 8, contact_id: 'C400'}
      - input: ref('stg_renewal__deal_contact_pairs')
        rows:
          - {deal_id: 100, contact_id: 'C100'}
          - {deal_id: 100, contact_id: 'C101'}
          - {deal_id: 200, contact_id: 'C200'}
          - {deal_id: 300, contact_id: 'C300'}
          - {deal_id: 400, contact_id: 'C400'}
      - input: ref('stg_renewal__deals')
        rows:
          - {deal_id: 100, closer_owner_id: '82672208', pipeline_id: '898243912', dealstage_id: '175346331', ever_entered_pc_close_excluded_stage: false}
          - {deal_id: 200, closer_owner_id: '99999999', pipeline_id: '898243912', dealstage_id: '175346325', ever_entered_pc_close_excluded_stage: false}
          - {deal_id: 300, closer_owner_id: '82672208', pipeline_id: '898243912', dealstage_id: '175346331', ever_entered_pc_close_excluded_stage: true}
