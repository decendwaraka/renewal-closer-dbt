version: 2

models:
  - name: int_renewal__won_deals
    description: "Closed-won renewal deals owned by a current closer, with ET close date and cash inputs."
  - name: int_renewal__deal_cash
    description: "Cash exploded to (deal, component) grain: base Cash Collected dated at the deal's Renewal Close Date, additional payments AP1-AP12 each dated at their own Collected Date (approved by Celeste 2026-10-21, all historical months). Only additional payments with a Collected Date count."
  - name: int_renewal__meetings
    description: >
      Renewal meetings categorized PC/RC/PWC/WB (plus WB_FOLLOW_UP and WB_WEBINAR, Call Outcomes only
      -- Celeste 2026-10-11, and FOLLOW_UP and MENTOR_HANDOFF, also Call Outcomes only -- Celeste
      2026-10-19) with booked/completed flags, attributed to closers. is_first_call (OPEN_ISSUES #23)
      flags the first completed call per deal per category, for Close Rate dedup. is_closing_call flags
      completed RC/PWC/WB calls that count as a 'Closing call' on the Closing Calls Today card and backs
      Close %. is_dpl_call is a SEPARATE, undeduped, outcome-agnostic flag that backs Avg DPL (Celeste,
      2026-10-19) -- see the dpl_call_types() macro; it is not derivable from meeting_category.
      Renewal Strategy Alignment and Renewal Accelerator Evergreen remain retired and map to no
      meeting_category (filtered out) -- business confirmed 2026-09-02, re-confirmed 2026-10-19. Renewal
      Follow-up was retired with them but came back on 2026-10-19 as FOLLOW_UP, Call Outcomes only.
      is_closing_call also excludes a PWC when the same deal already has a completed RC that same
      calendar month (Travis) -- the credit belongs to the RC. When that ordering can't be pinned down
      precisely (no deal_id, no RC that month), both calls count, per the agreed fallback.
  - name: int_renewal__live_call_contacts
    description: "One row per (meeting_id, contact_id) for COMPLETED closer-owned live calls, matching the team's HubSpot 'Live to Close Rate' report (2026-10-18). Types: Renewal Accelerator, Renewal Strategy, Renewal Post Webinar Call, Mentor Handoff, Winback Call, Winback Webinar -- legacy Renewal Winback Call excluded. is_won_after_meeting = the contact has any closed-won deal (renewal or win-back stage, any owner) with close date on or after the meeting date, no upper bound. Close Rate = COUNT(DISTINCT won contacts) / COUNT(DISTINCT contacts) over the window, counted at query time."

  - name: int_renewal__pc_close_deals
    description: "One row per (deal, qualifying meeting) for PC Close % (HubSpot report 445343752, 2026-10-21). See the model header: Renewal Pipeline (898243912) deals only, stage-history exclusion across both pipelines, completed Renewal 3 Month / Accelerator 3 month meeting joined through a contact (meeting -> contact -> deal, as in the report; a direct meeting-to-deal link alone does not count), won = closed-won stages, deal-owner attribution, no pipeline filter, Post Webinar 30d flag deliberately not applied. Equals the report (Oct 1-22 2026 with its pipeline filter: 68 deals / 1 won / 1.47%)."

unit_tests:
  - name: test_deal_cash_dates_base_at_close_and_payments_at_collected_date
    description: >
      Approved definition (Celeste Magre, 2026-10-21): base Cash Collected is dated at the deal's
      Renewal Close Date and every additional payment at its own Collected Date. Deal 1 closed Sep 12
      with an additional payment collected Oct 3: base is Sep 12, the payment is Oct 3. Deal 2's
      additional payment has an amount but no Collected Date, so it makes no row (only payments with the
      date filled in count). Deal 3 has no Renewal Close Date: no base row, but its dated additional
      payment still counts on its collected date. Deal 4's additional payment is $0 and makes no row.
      The input is fed as SQL because int_renewal__won_deals is ephemeral (dbt cannot introspect a
      relation that does not exist).
    model: int_renewal__deal_cash
    given:
      - input: ref('int_renewal__won_deals')
        format: sql
        rows: |
          select 1 as deal_id, '82672208' as closer_owner_id, cast('2026-09-12' as date) as close_date_et, cast(10000 as float) as cash_collected, cast(2500 as float) as ap1_amount, cast(0 as float) as ap2_amount, cast(0 as float) as ap3_amount, cast(0 as float) as ap4_amount, cast(0 as float) as ap5_amount, cast(0 as float) as ap6_amount, cast(0 as float) as ap7_amount, cast(0 as float) as ap8_amount, cast(0 as float) as ap9_amount, cast(0 as float) as ap10_amount, cast(0 as float) as ap11_amount, cast(0 as float) as ap12_amount, cast('2026-10-03' as timestamp) as ap1_stamped_at, cast(null as timestamp) as ap2_stamped_at, cast(null as timestamp) as ap3_stamped_at, cast(null as timestamp) as ap4_stamped_at, cast(null as timestamp) as ap5_stamped_at, cast(null as timestamp) as ap6_stamped_at, cast(null as timestamp) as ap7_stamped_at, cast(null as timestamp) as ap8_stamped_at, cast(null as timestamp) as ap9_stamped_at, cast(null as timestamp) as ap10_stamped_at, cast(null as timestamp) as ap11_stamped_at, cast(null as timestamp) as ap12_stamped_at
          union all
          select 2 as deal_id, '82672208' as closer_owner_id, cast('2026-09-20' as date) as close_date_et, cast(6800 as float) as cash_collected, cast(0 as float) as ap1_amount, cast(1200 as float) as ap2_amount, cast(0 as float) as ap3_amount, cast(0 as float) as ap4_amount, cast(0 as float) as ap5_amount, cast(0 as float) as ap6_amount, cast(0 as float) as ap7_amount, cast(0 as float) as ap8_amount, cast(0 as float) as ap9_amount, cast(0 as float) as ap10_amount, cast(0 as float) as ap11_amount, cast(0 as float) as ap12_amount, cast(null as timestamp) as ap1_stamped_at, cast(null as timestamp) as ap2_stamped_at, cast(null as timestamp) as ap3_stamped_at, cast(null as timestamp) as ap4_stamped_at, cast(null as timestamp) as ap5_stamped_at, cast(null as timestamp) as ap6_stamped_at, cast(null as timestamp) as ap7_stamped_at, cast(null as timestamp) as ap8_stamped_at, cast(null as timestamp) as ap9_stamped_at, cast(null as timestamp) as ap10_stamped_at, cast(null as timestamp) as ap11_stamped_at, cast(null as timestamp) as ap12_stamped_at
          union all
          select 3 as deal_id, '82672208' as closer_owner_id, cast(null as date) as close_date_et, cast(5000 as float) as cash_collected, cast(500 as float) as ap1_amount, cast(0 as float) as ap2_amount, cast(0 as float) as ap3_amount, cast(0 as float) as ap4_amount, cast(0 as float) as ap5_amount, cast(0 as float) as ap6_amount, cast(0 as float) as ap7_amount, cast(0 as float) as ap8_amount, cast(0 as float) as ap9_amount, cast(0 as float) as ap10_amount, cast(0 as float) as ap11_amount, cast(0 as float) as ap12_amount, cast('2026-08-15' as timestamp) as ap1_stamped_at, cast(null as timestamp) as ap2_stamped_at, cast(null as timestamp) as ap3_stamped_at, cast(null as timestamp) as ap4_stamped_at, cast(null as timestamp) as ap5_stamped_at, cast(null as timestamp) as ap6_stamped_at, cast(null as timestamp) as ap7_stamped_at, cast(null as timestamp) as ap8_stamped_at, cast(null as timestamp) as ap9_stamped_at, cast(null as timestamp) as ap10_stamped_at, cast(null as timestamp) as ap11_stamped_at, cast(null as timestamp) as ap12_stamped_at
          union all
          select 4 as deal_id, '82672208' as closer_owner_id, cast('2026-10-02' as date) as close_date_et, cast(4800 as float) as cash_collected, cast(0 as float) as ap1_amount, cast(0 as float) as ap2_amount, cast(0 as float) as ap3_amount, cast(0 as float) as ap4_amount, cast(0 as float) as ap5_amount, cast(0 as float) as ap6_amount, cast(0 as float) as ap7_amount, cast(0 as float) as ap8_amount, cast(0 as float) as ap9_amount, cast(0 as float) as ap10_amount, cast(0 as float) as ap11_amount, cast(0 as float) as ap12_amount, cast(null as timestamp) as ap1_stamped_at, cast(null as timestamp) as ap2_stamped_at, cast('2026-10-05' as timestamp) as ap3_stamped_at, cast(null as timestamp) as ap4_stamped_at, cast(null as timestamp) as ap5_stamped_at, cast(null as timestamp) as ap6_stamped_at, cast(null as timestamp) as ap7_stamped_at, cast(null as timestamp) as ap8_stamped_at, cast(null as timestamp) as ap9_stamped_at, cast(null as timestamp) as ap10_stamped_at, cast(null as timestamp) as ap11_stamped_at, cast(null as timestamp) as ap12_stamped_at
