        - {deal_id: 1, cash_component: 'ap1', cash_date_et: "2026-10-03", cash_amount: 2500}
        - {deal_id: 2, cash_component: 'base', cash_date_et: "2026-09-20", cash_amount: 6800}
        - {deal_id: 3, cash_component: 'ap1', cash_date_et: "2026-08-15", cash_amount: 500}
        - {deal_id: 4, cash_component: 'base', cash_date_et: "2026-10-02", cash_amount: 4800}

  - name: test_live_call_contacts_types_outcome_and_won_after_meeting
