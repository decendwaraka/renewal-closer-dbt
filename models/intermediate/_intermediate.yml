          - {meeting_id: 34, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-07-01 10:00:00"}
          - {meeting_id: 35, owner_id: '82672208', activity_type: 'Renewal Post Webinar Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
          - {meeting_id: 40, owner_id: '82672208', activity_type: 'Renewal Post Webinar Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
          - {meeting_id: 50, owner_id: '82672208', activity_type: 'Renewal Strategy', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-01 10:00:00"}
          - {meeting_id: 51, owner_id: '82672208', activity_type: 'Renewal Winback Call', meeting_outcome: 'COMPLETED', meeting_start_at: "2026-08-05 10:00:00"}
      - input: ref('stg_renewal__meeting_deals')
        rows:
          - {meeting_id: 30, deal_id: 200}
          - {meeting_id: 31, deal_id: 200}
          - {meeting_id: 32, deal_id: 201}
          - {meeting_id: 33, deal_id: 201}
          - {meeting_id: 34, deal_id: 202}
          - {meeting_id: 35, deal_id: 202}
          - {meeting_id: 50, deal_id: 203}
          - {meeting_id: 51, deal_id: 203}
      - input: ref('dim_closers')
        rows:
          - {owner_id: '82672208', closer_name: 'Sufijan Cunningham'}
    expect:
      rows:
        - {meeting_id: 30, deal_id: 200, meeting_category: 'RC', is_closing_call: true}
        - {meeting_id: 31, deal_id: 200, meeting_category: 'PWC', is_closing_call: false}
        - {meeting_id: 32, deal_id: 201, meeting_category: 'PWC', is_closing_call: false}
        - {meeting_id: 33, deal_id: 201, meeting_category: 'RC', is_closing_call: true}
        - {meeting_id: 34, deal_id: 202, meeting_category: 'RC', is_closing_call: true}
        - {meeting_id: 35, deal_id: 202, meeting_category: 'PWC', is_closing_call: true}
        - {meeting_id: 40, deal_id: null, meeting_category: 'PWC', is_closing_call: true}
        - {meeting_id: 50, deal_id: 203, meeting_category: 'RC', is_closing_call: true}
        - {meeting_id: 51, deal_id: 203, meeting_category: 'WB', is_closing_call: true}

  - name: test_meetings_closing_call_requires_first_call
    description: >
      Fixed 2026-10-05 (Close Rate contact-count review, Celeste): is_closing_call used to re-derive
      its own RC/PWC/WB dedup and ignored is_first_call entirely, so two completed calls in the same
      category on the same deal both earned Close Rate credit (live example: two September "Renewal
