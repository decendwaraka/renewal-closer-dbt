  - name: test_meetings_winback_renamed_types
    description: >
      2026-10-11 (Celeste): HubSpot renamed the Win-Back meeting types, and since hs_activity_type stores
      the label as its value, the rename changed the stored value. The model only matched the retired
      `Renewal Winback Call`, so `Winback Call` (in use since 2026-08-04) fell out of every metric.
      Old and new call names both map to WB and share one first-call ranking per deal -- deal 400's
      later new-name call is a follow-up of its earlier old-name call. Follow-Up and Webinar types (old
      and new names, any casing) map to WB_FOLLOW_UP / WB_WEBINAR: Call Outcomes only, so they're never
      ranked as a first call and never earn Close Rate credit, even when completed on their own deal.
