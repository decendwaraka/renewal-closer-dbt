version: 2

seeds:
  - name: dim_closers
    description: "Renewal closer roster (HubSpot owner ids). Base filter for all closer attribution."
    config:
      column_types:
        owner_id: varchar
        closer_name: varchar
    columns:
      - name: owner_id
        tests: [unique, not_null]

  - name: dim_renewal_stages
    description: "Deal stage reference for the HubSpot Pipeline Snapshot (both renewal pipelines and the Winbacks Pipeline)."
    config:
      column_types:
        stage_id: varchar
        pipeline_id: varchar
        stage_label: varchar
        stage_group: varchar
        snapshot_col: varchar
    columns:
      - name: stage_id
        tests: [unique, not_null]

  - name: dim_product_map
    description: "Maps upsell_plan values to product tier columns (ACC_T1/MM_T1/TERM_2) per Celeste/RevOps 2026-08-08 (OPEN_ISSUES #2)."
    config:
      column_types:
        upsell_plan: varchar
        product_column: varchar
        notes: varchar
    columns:
      - name: upsell_plan
        tests: [unique, not_null]

  - name: dim_member_tier_map
    description: "Maps active_product_snapshot_at_won values to tier-of-origin columns (ACC_TIER/MM_TIER/TERM_2) per Celeste 2026-08-12 (OPEN_ISSUES #8) -- separate from dim_product_map, which stays on upsell_plan for the product-mix split. Join is case-insensitive in int_renewal__won_deals.sql since live data has inconsistent casing (e.g. 'Defi'/'DeFi')."
    config:
      column_types:
        active_product_snapshot_at_won: varchar
        tier_of_origin_column: varchar
        notes: varchar
    columns:
      - name: active_product_snapshot_at_won
        tests: [unique, not_null]
