version: 2

seeds:
  - name: dim_closers
    description: >
      Renewal closer roster (HubSpot owner ids). Base filter for all closer attribution. rep_team
      (Celeste, 2026-10-19, Metrics Guide #16) splits the roster into the two books of business the
      team manages separately -- MM (Mastermind) and ACC (Accelerator) -- so the dashboard can show
      an MM DPL and an ACC DPL card beside the team Avg DPL without a second lookup.
    config:
      column_types:
        owner_id: varchar
        closer_name: varchar
        rep_team: varchar
    columns:
      - name: owner_id
        tests: [unique, not_null]
      - name: rep_team
        description: >
          MM or ACC. Deliberately BLANK for Henna Shakoor: she is off the renewal team but is kept on
          the roster on purpose (see int_renewal__live_call_contacts.sql) so Close % and the other
          leaderboard cards all run off one roster. A blank rep_team keeps her out of both DPL cards
          while leaving her in the team total.
        tests:
          - accepted_values:
              # warn, not error: the blank above is expected and would fail a strict test. This is a
              # tripwire for a genuinely new team code, not a not_null check.
              severity: warn
              values: ['MM', 'ACC']

  - name: dim_renewal_stages
    description: "Deal stage reference for the HubSpot Pipeline Snapshot (both renewal pipelines and the Winbacks Pipeline)."
    config:
      column_types:
        stage_id: varchar
        pipeline_id: varchar
        stage_label: varchar
        stage_group: varchar
        snapshot_col: varchar
    columns:
      - name: stage_id
        tests: [unique, not_null]

  - name: dim_product_map
    description: >
      Maps upsell_plan values to two independent splits: product_column, the product tier
      (ACC_TIER/MM_TIER/TERM_2) per Celeste/RevOps 2026-08-08 (OPEN_ISSUES #2), and pipeline_type,
      the commercial motion (Upgrade/Restart/Renewal/Win-Back) backing the Product Mix heatmap
      (2026-09-07). The two are orthogonal -- e.g. 'Upgrade - Mastermind Pro' is MM_TIER x Upgrade,
      'Winback - MM Pro' is MM_TIER x Win-Back.
    config:
      column_types:
        upsell_plan: varchar
        product_column: varchar
        pipeline_type: varchar
        notes: varchar
    columns:
      - name: upsell_plan
        tests: [unique, not_null]
      - name: product_column
        tests:
          - not_null
          - accepted_values:
              values: ['ACC_TIER', 'MM_TIER', 'TERM_2']
      - name: pipeline_type
        description: >
          Commercial motion. Seeded rather than derived from the upsell_plan name prefix so a future
          value like 'Renewal - Upgrade Path' cannot be silently misclassified. fct_renewal_cash
          overrides this to 'Win-Back' for any deal in the Winbacks Pipeline, so the pipeline always
          wins over the product name.
        tests:
          - not_null
          - accepted_values:
              values: ['Upgrade', 'Restart', 'Renewal', 'Win-Back']

  - name: dim_member_tier_map
    description: >
      Maps active_product_snapshot_at_won values to tier-of-origin columns (ACC_TIER/MM_TIER/TERM_2)
      per Celeste 2026-08-12 (OPEN_ISSUES #8) -- separate from dim_product_map, which stays on
      upsell_plan for the product-mix split. Join is case-insensitive in int_renewal__won_deals.sql
      since live data has inconsistent casing (e.g. 'Defi'/'DeFi').
      2026-10-19 (Celeste, Metrics Guide #13): the dashboard column "Term 2 (B/G/P)" is renamed to
      "Long Term (B/S/G/P)" and Silver is added to the band. The warehouse value deliberately STAYS
      TERM_2 -- this is a display-label change only, and renaming it would touch the accepted_values
      tests here and in _marts.yml, the frontend TIER_ORIGIN_COL_MAP, the metric glossary and the
      validation config for no behavioural gain.
    config:
      column_types:
        active_product_snapshot_at_won: varchar
        tier_of_origin_column: varchar
        notes: varchar
    columns:
      - name: active_product_snapshot_at_won
        tests: [unique, not_null]
