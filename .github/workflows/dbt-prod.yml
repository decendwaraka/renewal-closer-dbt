name: dbt run (prod)

# Refreshes PRODUCTION.RENEWAL_* every 2 hours (cron is UTC), on every merge to main so model
# changes go live right away, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Never let two prod runs overlap; let a running run finish rather than cancel it. GitHub keeps at
# most one run pending per group, so back-to-back merges collapse into one follow-up run - which
# checks out main's tip (below), so it includes every merge.
concurrency:
  group: dbt-prod
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/ci
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/rsa_key.p8
    steps:
      # Always run the latest main, never the triggering commit: a run that sat queued behind
      # another would otherwise deploy a stale SHA, and a manual dispatch from a feature branch
      # would push unmerged models to prod.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install "dbt-core==1.11.8" "dbt-snowflake==1.11.4"

      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$SNOWFLAKE_PRIVATE_KEY_PATH"

      - name: dbt deps
        run: dbt deps

      - name: dbt debug (connection check)
        run: dbt debug --target prod

      # Seeds are repo-owned mapping files (tier, product, closer, stage maps). Without this a
      # merged seed edit never reaches prod -- dbt#37's tier-map fix sat unapplied for this reason.
      # Plain `dbt seed`, not --full-refresh: a column change then fails loudly instead of
      # dropping and recreating the table (and its grants) every 2 hours.
      # continue-on-error so a seed failure can't stop the model refresh below; the last step
      # still fails the job so it shows red.
      - name: dbt seed (prod)
        id: seed
        continue-on-error: true
        run: dbt seed --target prod

      - name: dbt run (prod)
        run: dbt run --target prod

      - name: Fail if dbt seed failed
        if: steps.seed.outcome == 'failure'
        run: |
          echo "dbt seed (prod) failed -- models refreshed, but seed edits did not reach prod."
          exit 1
