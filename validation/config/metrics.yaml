        - {property: hubspot_owner_id, operator: EQ, value: ":owner_id"}
    comparison: {mode: exact, tolerance: 0}
    caveats:
      - "STALE vs the dashboard's Call Outcomes tile: RC Booked (#17) moved off this deal-stage basis on 2026-08-28 onto a contact-grain rebuild (FCT_RENEWAL_CONTACT_BOOKINGS, a renewal-type meeting's hs_createdate) -- see metric-catalog.ts #17. This config still validates the old, superseded definition."

  - id: rc_completed
    name: "RC Completed"
    formula_refs: ["#18"]
    snowflake:
      sql: |
        SELECT COUNT(*) AS value
        FROM PRODUCTION.RENEWAL_MARTS.FCT_RENEWAL_MEETINGS
