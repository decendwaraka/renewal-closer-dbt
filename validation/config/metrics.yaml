        - {property: hubspot_owner_id, operator: EQ, value: ":owner_id"}
    comparison: {mode: exact, tolerance: 0}
    caveats:
      - "STALE vs the dashboard's Call Outcomes tile: RC Invited (#16) moved off this deal-stage basis on 2026-08-28 onto a contact-grain rebuild (FCT_RENEWAL_CONTACT_INVITES, six HubSpot Contact invite-date properties) to match Celeste's live 'True Booking Rate' report -- see metric-catalog.ts #16. This config still validates the old, superseded definition."

  - id: rc_booked
