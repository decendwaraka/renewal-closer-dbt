# Declarative metric definitions for the HubSpot <-> Snowflake validation framework.
#
# THIS FILE IS SEEDED FROM THE METRIC GLOSSARY (metric-catalog.ts + dashboard_formula.md +
# the dbt seeds), NOT from the real live HubSpot dashboard's actual filter list -- that
# list doesn't exist yet. When it arrives, edit the `hubspot:` block of the relevant
# metric id(s) below; nothing in runner.py/compare.py/cli.py needs to change.
#
# Every `snowflake.sql` uses %(start)s / %(end)s / %(owner_id)s bind params (pyformat,
# matches snowflake-connector-python's default paramstyle). owner_id is nullable --
# omit the owner filter clause at the call site for team-level totals.
#
# HubSpot property names marked "CONFIRM" are Fivetran staging-alias best guesses, not
# verified live property names -- per the validate-metric skill's rule, never trust a
# staging alias as the live name. Run HubSpot's get_properties/search_properties (or
# the MCP tool_guidance-recommended equivalent) once per property before the first real
# run and correct any that differ.
#
# Formula numbers in `formula_refs` cite source/dashboard_formula.md's numbering
# (extends the original 57-formula spec to 74 incl. Win-Back).

closers_seed: ../seeds/dim_closers.csv          # owner_id,closer_name -- iterate for per-closer runs
product_map_seed: ../seeds/dim_product_map.csv  # upsell_plan,product_column
stages_seed: ../seeds/dim_renewal_stages.csv     # stage_id,pipeline_id,stage_label,stage_group,snapshot_col
                                                   # (pipeline_snapshot.* metrics are auto-generated from this
                                                   #  file by metrics.py -- see load_pipeline_snapshot_metrics)

pipelines:
  renewal_sales: "95211801"
  renewal_pipeline: "898243912"
  winback: "917643668"
won_stage_ids: ["175346331", "229787714", "1359841456"]      # Closed Won-PIF / Closed Won-Payment Plan / Closed Won
winback_won_stage_ids: ["1401758776"]                          # Winback Closed Won

metrics:

  # --- Core leaderboard metrics (#1-4, #35; also #7-9 when window=today) ---

  - id: deals_won
    name: "Deals Won"
    formula_refs: ["#2", "#7", "#33"]
    snowflake:
      sql: |
        SELECT COUNT(*) AS value
        FROM PRODUCTION.RENEWAL_MARTS.FCT_RENEWAL_WON_DEALS
        WHERE close_date_et BETWEEN %(start)s AND %(end)s
          AND (%(owner_id)s IS NULL OR closer_owner_id = %(owner_id)s)
    hubspot:
      object: deals
      aggregation: count
      filters:
        - {property: pipeline, operator: IN, value: ["95211801", "898243912", "917643668"]}
        - {property: dealstage, operator: IN, value: ["175346331", "229787714", "1359841456", "1401758776"]}
        - {property: hubspot_owner_id, operator: EQ, value: ":owner_id"}   # CONFIRM: deal owner is top-level ownerId, not a "property" filter -- see note below
        - {property: upsell___close_date, operator: BETWEEN, value: [":start", ":end"]}  # CONFIRM live name (Fivetran collapses upsell___close_date)
    comparison: {mode: exact, tolerance: 0}
    caveats:
      - "deal owner in HubSpot's search API is the object-level `hubspot_owner_id` associated property, not `owner_id` -- confirm exact filter property name via search_properties before first run"
      - "cut window off at yesterday ET by default -- same-day Fivetran sync lag produces false-positive gaps (see project memory)"

  - id: total_cash
    name: "Total Cash / Rainmaker"
    formula_refs: ["#1", "#8"]
    snowflake:
      sql: |
        SELECT SUM(cash_amount) AS value
        FROM PRODUCTION.RENEWAL_MARTS.FCT_RENEWAL_CASH
        WHERE cash_date_et BETWEEN %(start)s AND %(end)s
          AND (%(owner_id)s IS NULL OR closer_owner_id = %(owner_id)s)
    hubspot:
      object: deals
      aggregation: sum_dated_components
      base_filters:
        - {property: pipeline, operator: IN, value: ["95211801", "898243912", "917643668"]}
        - {property: dealstage, operator: IN, value: ["175346331", "229787714", "1359841456", "1401758776"]}
        - {property: hubspot_owner_id, operator: EQ, value: ":owner_id"}
      components:   # base at the deal's Renewal Close Date, each additional payment at its own Collected Date (Celeste, 2026-10-21); a payment with no date is skipped. HubSpot internal names, verified live 2026-10-21
        - {amount_prop: cash_collected, date_prop: upsell___close_date}
        - {amount_prop: additional_payment__1_amount, date_prop: additional_payment__1_stamped_date}
        - {amount_prop: additional_payment__2_amount, date_prop: additional_payment__2_stamped_date}
        - {amount_prop: collected_amount__additional_payment_3, date_prop: collected_date_additional_payment_3}
        - {amount_prop: collected_amount__additional_payment_4, date_prop: collected_date_additional_payment_4}
        - {amount_prop: collected_amount__additional_payment_5, date_prop: collected_date_additional_payment_5}
        - {amount_prop: collected_amount__additional_payment_6, date_prop: collected_date_additional_payment_6}
        - {amount_prop: collected_amount__additional_payment_7, date_prop: collected_date_additional_payment_7}
        - {amount_prop: collected_amount__additional_payment_8, date_prop: collected_date_additional_payment_8}
        - {amount_prop: collected_amount__additional_payment_9, date_prop: collected_date_additional_payment_9}
        - {amount_prop: collected_amount__additional_payment_10, date_prop: collected_date_additional_payment_10}
        - {amount_prop: collected_amount__additional_payment_11, date_prop: collected_date_additional_payment_11}
        - {amount_prop: collected_amount__additional_payment_12, date_prop: collected_date_additional_payment_12}
    comparison: {mode: exact, tolerance: 1.00}
    caveats:
      - "All 13 components wired (base + AP1-AP12). AP7-AP12 exist in HubSpot but not yet in Snowflake (Fivetran has not created the columns); all are $0 for 2026 so far, so a non-zero here means cash entered in an index dbt cannot see yet."
      - "AP1/AP2 use additional_payment__N_amount / additional_payment__N_stamped_date (double underscore); AP3+ use collected_amount__additional_payment_N / collected_date_additional_payment_N (note: no double underscore in the date name)."

  # --- Call Outcomes (#10-21, #52-57 for PC/RC/PWC; #69-74 for Win-Back) ---
  # invited/booked are DEAL-STAGE-BASIS per OPEN_ISSUES #17 (dashboard moved off the
  # original meeting-object-basis spec) -- filter on dealstage_id via dim_renewal_stages,
  # not on the meeting object. completed stays meeting-object-basis (no stage tracks it).

  - id: pc_invited
    name: "PC Invited"
    formula_refs: ["#10"]
    snowflake:
      sql: |
        SELECT COUNT(deal_count) AS value FROM (
          SELECT deal_count FROM PRODUCTION.RENEWAL_MARTS.FCT_RENEWAL_PIPELINE_SNAPSHOT
          WHERE snapshot_col = 'pc_invited' AND (%(owner_id)s IS NULL OR closer_owner_id = %(owner_id)s)
        )
    hubspot:
      object: deals
      aggregation: count
      filters:
        - {property: dealstage, operator: IN, value: ["240516941", "1359841792"]}
        - {property: hubspot_owner_id, operator: EQ, value: ":owner_id"}
    comparison: {mode: exact, tolerance: 0}
    caveats:
      - "live/current-state count, not date-windowed -- matches dashboard's Pipeline Snapshot semantics"
      - "STALE vs the dashboard's Call Outcomes tile: PC Invited (#10) moved off this deal-stage basis on 2026-08-28 onto a contact-grain rebuild (FCT_RENEWAL_CONTACT_INVITES, six HubSpot Contact invite-date properties) to match Celeste's live 'True Booking Rate' report -- see metric-catalog.ts #10. This config still validates the old, superseded definition."

  - id: pc_booked
    name: "PC Booked"
    formula_refs: ["#11"]
    snowflake:
      sql: |
        SELECT COUNT(deal_count) AS value FROM (
          SELECT deal_count FROM PRODUCTION.RENEWAL_MARTS.FCT_RENEWAL_PIPELINE_SNAPSHOT
          WHERE snapshot_col = 'pc_scheduled' AND (%(owner_id)s IS NULL OR closer_owner_id = %(owner_id)s)
        )
    hubspot:
      object: deals
      aggregation: count
      filters:
        - {property: dealstage, operator: IN, value: ["175346325", "1359841793"]}
        - {property: hubspot_owner_id, operator: EQ, value: ":owner_id"}
    comparison: {mode: exact, tolerance: 0}
    caveats:
      - "stage_label is 'Midway Check In Scheduled' -- dashboard calls this tile 'Booked'"
      - "STALE vs the dashboard's Call Outcomes tile: PC Booked (#11) moved off this deal-stage basis on 2026-08-28 onto a contact-grain rebuild (FCT_RENEWAL_CONTACT_BOOKINGS, a renewal-type meeting's hs_createdate) -- see metric-catalog.ts #11. This config still validates the old, superseded definition."

  - id: pc_completed
    name: "PC Completed"
    formula_refs: ["#12"]
    snowflake:
      sql: |
        SELECT COUNT(*) AS value
        FROM PRODUCTION.RENEWAL_MARTS.FCT_RENEWAL_MEETINGS
        WHERE meeting_category = 'PC' AND is_completed
          AND meeting_date_et BETWEEN %(start)s AND %(end)s
          AND (%(owner_id)s IS NULL OR closer_owner_id = %(owner_id)s)
    hubspot:
      object: meetings
      aggregation: count
      filters:
        - {property: hs_activity_type, operator: IN, value: ["Renewal 3 Month", "Renewal Accelerator 3 month"]}
        - {property: hs_meeting_outcome, operator: EQ, value: "COMPLETED"}   # exact match, not LIKE -- OPEN_ISSUES #7 revert
        - {property: hubspot_owner_id, operator: EQ, value: ":owner_id"}
        - {property: hs_meeting_start_time, operator: BETWEEN, value: [":start", ":end"]}
    comparison: {mode: exact, tolerance: 0}
    caveats:
      - "is_meeting_completed macro reverted to exact = 'COMPLETED' (2026-08-06) -- COMPLETED-NURTURE/QUALIFIED sub-outcomes excluded, matches spec literally"
      - "BETWEEN on a datetime property resolves to UTC midnight in HubSpot search -- pass full ISO timestamps with explicit offset, not bare YYYY-MM-DD, to align with the warehouse's ET day bucketing"

  - id: rc_invited
    name: "RC Invited"
    formula_refs: ["#16"]
    snowflake:
      sql: |
        SELECT COUNT(deal_count) AS value FROM (
          SELECT deal_count FROM PRODUCTION.RENEWAL_MARTS.FCT_RENEWAL_PIPELINE_SNAPSHOT
